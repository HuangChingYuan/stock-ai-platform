# 每週回測一次：比較 LLM 建議與規則式判斷的勝率，結果顯示在該次執行的摘要頁（Summary）
# 排程時間為 UTC；週六 02:00 UTC = 台灣週六 10:00。
name: backtest

on:
  schedule:
    - cron: "0 2 * * 6"
  workflow_dispatch:
    inputs:
      stocks:
        description: "指定股票（逗號分隔，留空為全部）"
        required: false
      horizons:
        description: "持有交易日數（逗號分隔）"
        required: false
        default: "5,20"

permissions:
  contents: read

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-jobs.txt
      - run: pip install -r requirements-jobs.txt
      - name: Run backtest
        env:
          INPUT_STOCKS: ${{ inputs.stocks }}
          INPUT_HORIZONS: ${{ inputs.horizons }}
        run: |
          ARGS=(--csv backtest.csv)
          if [ -n "$INPUT_STOCKS" ]; then ARGS+=(--stocks "$INPUT_STOCKS"); fi
          if [ -n "$INPUT_HORIZONS" ]; then ARGS+=(--horizons "$INPUT_HORIZONS"); fi
          python -m jobs.backtest "${ARGS[@]}"
      - uses: actions/upload-artifact@v4
        with:
          name: backtest
          path: backtest.csv
