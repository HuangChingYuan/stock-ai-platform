# Alembic 設定。連線字串一律讀環境變數 DATABASE_URL（見 migrations/env.py），這裡不寫。
#   新增欄位或資料表：改 core/models.py 後執行
#     alembic revision --autogenerate -m "說明"
#   檢查產生的檔案，推上去；API 啟動與每日排程會自動 upgrade 到最新版。
[alembic]
script_location = migrations
prepend_sys_path = .
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = logging.StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
