<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#16202b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>台股 AI 分析</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <h1 class="brand">台股 AI 分析</h1>
      <p class="status" id="status" role="status" aria-live="polite">
        <span class="dot" aria-hidden="true"></span><span id="status-text">連線中</span>
      </p>
    </header>

    <nav class="board" aria-label="自選股">
      <ol class="quotes" id="quotes"></ol>
      <form class="add" id="add-form">
        <label class="visually-hidden" for="add-input">輸入股票代號</label>
        <input id="add-input" inputmode="numeric" autocomplete="off" placeholder="代號" maxlength="6">
        <button type="submit">查看</button>
        <button type="button" class="pick" id="pick-open" aria-haspopup="dialog">類股</button>
      </form>
    </nav>

    <main class="stage">
      <div class="views" role="tablist" id="views" aria-label="分析畫面"></div>
      <div class="frame-wrap">
        <iframe id="frame" title="分析畫面" loading="eager"
                allow="clipboard-write; fullscreen" referrerpolicy="no-referrer-when-downgrade"></iframe>
        <div class="veil" id="veil" hidden>
          <p class="veil-title" id="veil-title">載入中</p>
          <p class="veil-body" id="veil-body"></p>
        </div>
        <div class="wake-note" id="wake-note" role="note" hidden>
          <p id="wake-text"></p>
          <a id="wake-link" target="_blank" rel="noopener">開新分頁喚醒</a>
          <button type="button" id="wake-reload">重新載入</button>
          <button type="button" class="wake-close" id="wake-close" aria-label="關閉提示">×</button>
        </div>
      </div>
    </main>
  </div>

  <dialog class="picker" id="picker" aria-labelledby="picker-title">
    <header class="picker-head">
      <h2 id="picker-title">依類股選股</h2>
      <div class="markets" id="markets" role="group" aria-label="市場"></div>
      <label class="visually-hidden" for="picker-filter">篩選代號或名稱</label>
      <input id="picker-filter" type="search" autocomplete="off" placeholder="篩選代號或名稱">
      <button type="button" class="picker-close" id="picker-close" aria-label="關閉">×</button>
    </header>
    <div class="picker-body">
      <ul class="industries" id="industries" aria-label="類股"></ul>
      <section class="picks" aria-live="polite">
        <p class="picks-note" id="picks-note"></p>
        <ul class="pick-list" id="pick-list"></ul>
      </section>
    </div>
  </dialog>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
